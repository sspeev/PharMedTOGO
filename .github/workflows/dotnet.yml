name: .NET 10 CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore PharMedTOGO.slnx

    - name: Build Solution
      run: dotnet build PharMedTOGO.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test PharMedTOGO.slnx --configuration Release --no-build --verbosity normal

  build-docker:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: PharMedTOGO/Dockerfile
        push: false
        tags: pharmedtogo:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
