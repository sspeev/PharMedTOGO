services:
  pharmedtogo:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_Kestrel__Certificates__Default__Password=5ab0b555-4db3-4c0a-99fe-32e85c516713
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/root/.aspnet/https/PharMedTOGO.pfx
      - web__client_id=${GOOGLE_CLIENT_ID}
      - web__client_secret=${GOOGLE_CLIENT_SECRET}
    ports:
      - "80"
      - "443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro